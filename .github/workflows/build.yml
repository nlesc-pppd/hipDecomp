name: "Build"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  rocm-version: "10.1"
  rocm-version-full: "10.1.0"
  openmpi-version: "5.0.11"
  target-gpu: "gfx90a"

jobs:
  test-build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache ROCm installation
        id: cache-rocm
        uses: actions/cache@v5
        with:
          path: |
            /opt/rocm/
          key: rocm-${{ runner.os }}-${{ env.rocm-version }}

      - name: Cache OpenMPI installation
        id: cache-openmpi
        uses: actions/cache@v5
        with:
          path: |
            /opt/openmpi/
          key: openmpi-${{ runner.os }}-${{ env.openmpi-version }}-${{ env.rocm-version }}

      # Always sets path, cache restore does not do this for ROCm
      - name: Setup PATH
        run: |
          echo /opt/openmpi/bin >> $GITHUB_PATH
          echo /opt/rocm/bin >> $GITHUB_PATH

      - name: Install ROCm
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        # Does not yet support ROCm 10+
        #uses: loostrum/rocm-installer@v0.2
        #with:
        #  version: ${{ env.rocm-version }}
        #  packages: rocm-hip-runtime-dev hipcub-dev hipfft-dev rccl-dev rocshmem-dev rocprofiler-sdk-roctx
        run: |
          sudo mkdir -p --mode=0755 /etc/apt/keyrings
          wget https://stable.repo.amd.com/rocm/gpg/packages.gpg -O - | gpg --dearmor | sudo tee /etc/apt/keyrings/amdrocm.gpg > /dev/null
          sudo tee /etc/apt/sources.list.d/amdrocm-stable.sources << EOF
          X-Repo-Id: amdrocm-stable
          Types: deb
          URIs: https://stable.repo.amd.com/rocm/core/packages/ubuntu2604/
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/amdrocm.gpg
          Enabled: yes
          EOF
          sudo apt update
          sudo apt install amdrocm-core-dev${{ env.rocm-version }}-${{ env.target-gpu }} amdrocm-fft-dev${{ env.rocm-version }} amdrocm-rccl-dev${{ env.rocm-version }} amdrocm-rocshmem-dev${{ env.rocm-version }}

      - name: Install hipfort
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ROCm/hipfort -b rocm-${{ env.rocm-version-full }}
          cd hipfort
          cmake -S . -B build -DCMAKE_C_COMPILER=amdclang -DCMAKE_CXX_COMPILER=amdclang++ -DCMAKE_Fortran_COMPILER=amdflang -DHIPFORT_BUILD_NVPTX=0 -DCMAKE_INSTALL_PREFIX=/opt/rocm
          make -C build -j
          sudo make -C build install

      - name: Install OpenMPI
        if: steps.cache-openmpi.outputs.cache-hit != 'true'
        run: |
          wget https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-${{ env.openmpi-version }}.tar.gz
          tar xzf openmpi-${{ env.openmpi-version }}.tar.gz
          cd openmpi-${{ env.openmpi-version}}
          CC=amdclang CXX=amdclang++ FC=amdflang ./configure --prefix=/opt/openmpi/ --with-rocm
          make -j
          sudo make install

      - name: Build hipDecomp
        run: |
          cmake -S . -B build -DHIPDECOMP_BUILD_EXTRAS=1 -DHIPDECOMP_BUILD_FORTRAN=1 -DHIPDECOMP_ENABLE_ROCTX=1 -DHIPDECOMP_ENABLE_ROCSHMEM=1 -DCMAKE_HIP_ARCHITECTURES=${{ env.target-gpu }}
          make -C build -j
